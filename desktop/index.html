<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'">
<title>OW Bridge</title><link rel="stylesheet" href="style.css"></head>
<body>
<aside>
  <div class="brand-mark" aria-hidden="true"></div><h1>OW Bridge</h1><p class="tagline">让 WorkBuddy 连接 OpenCode</p>
  <div class="section-current">▦ &nbsp; 模型与服务</div>
  <div class="sidebar-bottom"><button id="update-runtime">更新 OpenCode</button><label class="toggle-label">使用系统代理 <input id="proxy" type="checkbox" role="switch"></label><p class="creator">使用问题在抖音/视频号<br>@娄老师说的对</p></div>
</aside>
<main>
  <header><div><h2>免费模型</h2><p class="subtitle">读取后可手动检测，或勾选模型直接导入 WorkBuddy。</p></div><div class="actions"><button id="refresh">读取免费模型</button></div></header>
  <div class="service-status"><span id="service-dot" class="dot"></span><span id="service-text">正在启动隔离模型服务</span><button id="restart" hidden>重试</button></div>
  <section class="toolbar"><div class="metrics"><div><b id="discovered">0</b><span>已发现</span></div><div><b id="available">0</b><span>可导入</span></div><div><b id="pending">0</b><span>待检测</span></div></div><button id="import" class="primary">导入 WorkBuddy</button></section>
  <div id="feedback" role="status" hidden></div>
  <section id="models" aria-label="模型列表"></section>
  <section id="details" hidden></section>
  <footer><p id="sync">按 OpenCode 声明导入模型；检测不影响使用</p><p class="note">启动只读取模型，点击模型旁的“检测”才会检测并使用免费额度。耗时为完整请求用时，非首字延迟；检测结果不代表完整工具流程已验证。</p></footer>
</main>
<script src="activity.cjs"></script>
<script src="renderer.js"></script>
</body></html>
